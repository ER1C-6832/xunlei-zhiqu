[project]
name = "xunlei-zhiqu-runtime"
version = "0.1.0"
description = "Local FastAPI runtime for 迅雷智取"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1"
]

[dependency-groups]
dev = [
  "ruff>=0.12,<1"
]

[tool.uv]
# Runtime commands should not install lint tooling implicitly. Use
# `uv run --group dev ruff ...` only when linting is intentionally requested.
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xunlei_zhiqu_runtime"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
